simple_stripe_donation.settings:
  type: config_object
  label: 'Simple Stripe Donation settings'
  mapping:
    stripe:
      type: mapping
      label: 'Stripe settings'
      mapping:
        mode:
          type: string
          label: 'Stripe mode (test or live)'
        currency:
          type: string
          label: 'Currency (ISO 4217, lowercase)'
        test_publishable_key:
          type: string
          label: 'Test publishable key'
        test_secret_key:
          type: string
          label: 'Test secret key'
        test_webhook_secret:
          type: string
          label: 'Test webhook signing secret'
        live_publishable_key:
          type: string
          label: 'Live publishable key'
        live_secret_key:
          type: string
          label: 'Live secret key'
        live_webhook_secret:
          type: string
          label: 'Live webhook signing secret'
    donation:
      type: mapping
      label: 'Donation settings'
      mapping:
        preset_amounts:
          type: sequence
          label: 'Preset donation amounts'
          sequence:
            type: string
            label: 'Amount'
        minimum_amount:
          type: string
          label: 'Minimum donation amount'
        maximum_amount:
          type: string
          label: 'Maximum donation amount'
        allow_custom_amount:
          type: boolean
          label: 'Allow custom amount'
        allow_donor_name:
          type: boolean
          label: 'Allow donor name'
        allow_donor_phone:
          type: boolean
          label: 'Allow donor phone'
        allow_donor_address:
          type: boolean
          label: 'Allow donor address'
        allow_donor_message:
          type: boolean
          label: 'Allow donor message'
        allow_anonymous:
          type: boolean
          label: 'Allow anonymous donation'
        reference_prefix:
          type: string
          label: 'Donation reference prefix'
        reference_digits:
          type: integer
          label: 'Donation reference number padding (digit count)'
    email:
      type: mapping
      label: 'Email settings'
      mapping:
        send_donor_receipt:
          type: boolean
          label: 'Send donor receipt'
        send_admin_notification:
          type: boolean
          label: 'Send admin notification'
        admin_notification_email:
          type: string
          label: 'Admin notification email address(es), comma-separated'
        donor_subject:
          type: label
          label: 'Donor receipt subject template'
        admin_subject:
          type: label
          label: 'Admin notification subject template'
